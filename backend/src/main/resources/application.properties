spring.application.name=unitrade

# Render (and similar hosts) tell the app which port to use via PORT; locally 8080.
server.port=${PORT:8080}

# Local, git-ignored overrides (DB password etc.). Copy application-local.properties.example.
# Paths are relative to the folder the backend is started from: backend/ (mvnw in a terminal)
# or the repository root (Run button in VS Code / IntelliJ). Whichever file exists is used.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# ---------- Database (MySQL 8) ----------
# Values come from environment variables, or from application-local.properties.
# No passwords are stored in git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/unitrade?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:unitrade}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the @Entity classes (simple; fine for this project).
spring.jpa.hibernate.ddl-auto=update
# Close the DB session when the service method ends (avoids hidden lazy-loading queries in controllers).
spring.jpa.open-in-view=false

# ---------- Authentication (FR1) ----------
# Only emails ending in "@" + this domain may register (the Term 1 charter wrote cput.ac.za; student mailboxes use mycput.ac.za).
app.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:mycput.ac.za}
# Login-token signing key (env var JWT_SECRET). If blank (local runs), a random key is made at start-up
# and a warning is logged: tokens then stop working whenever the backend restarts.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# Demo data (3 students, documented in README) is inserted once when the users table is empty.
app.seed.enabled=true

# ---------- CORS ----------
# Comma-separated list of browser origins allowed to call /api (add the Vercel URL when deployed).
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
