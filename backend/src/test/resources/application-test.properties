# Test profile: in-memory H2, fresh schema per test context. No MySQL, no Redis needed (CI uses this).
spring.datasource.url=jdbc:h2:mem:unitrade-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Tests create their own users; no demo data.
app.seed.enabled=false
